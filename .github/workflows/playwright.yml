name: Playwright Tests with Allure

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Run Tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps
          pip install pytest-rerunfailures

      - name: Run Pytest with Allure
        run: |
          pytest --browser_name=${{ matrix.browser }} --headless --alluredir=allure-results --reruns 3 --reruns-delay 10
        continue-on-error: true

      - name: Upload Allure Results Artifact
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.browser }}
          path: allure-results
          retention-days: 1

  generate-report-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Allure Results from all matrices
        uses: actions/download-artifact@v4
        with:
          path: all-allure-results

      - name: Merge Allure Results
        run: |
          mkdir -p allure-results
          cp -r all-allure-results/allure-results-*/* allure-results/ || true

      - name: Setup Java for Allure CLI
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Allure CLI
        run: |
          sudo wget https://github.com/allure-framework/allure2/releases/download/2.29.0/allure-2.29.0.tgz -O /opt/allure.tgz
          sudo tar -zxvf /opt/allure.tgz -C /opt/
          sudo ln -s /opt/allure-2.29.0/bin/allure /usr/bin/allure

      - name: Generate Allure Report
        run: |
          allure generate allure-results --clean -o allure-report

      - name: Deploy Report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-report
          destination_dir: allure-history
          keep_files: true

      - name: Send Slack Notification
        if: always()
        uses: 8398a7/action-slack@v3.5.1
        with:
          status: ${{ job.status }}
          fields: repo,message,commit,author,action,eventName,ref,workflow,job
          text: "📊 Test run finished! Check out the Allure Report here: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/allure-history/"
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}